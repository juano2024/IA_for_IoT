# Broker MQTT de la Practica 2.
# Autenticacion obligatoria por usuario y contrasena (el entrypoint genera el
# archivo de contrasenas a partir de MQTT_USER / MQTT_PASSWORD).

listener 1883 0.0.0.0

allow_anonymous false
password_file /mosquitto/data/passwd

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
connection_messages true

# El contenedor arranca como root para poder generar el archivo de contrasenas;
# despues mosquitto baja privilegios a este usuario.
user mosquitto
