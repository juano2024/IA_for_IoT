apiVersion: 1

groups:
  - orgId: 1
    name: confort-invernadero
    folder: IA for IoT
    interval: 10s
    rules:
      - uid: temperatura-alta
        title: Temperatura alta (mas de 30 C)
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: influxdb-iot
            model:
              refId: A
              datasource:
                type: influxdb
                uid: influxdb-iot
              rawQuery: true
              resultFormat: time_series
              query: |
                from(bucket: "iot")
                  |> range(start: -5m)
                  |> filter(fn: (r) => r._measurement == "clima" and r._field == "temperatura_c")
                  |> keep(columns: ["_time", "_value", "_field", "dispositivo"])
                  |> group(columns: ["_field", "dispositivo"])
                  |> sort(columns: ["_time"])
                  |> last()
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              datasource:
                type: __expr__
                uid: __expr__
              type: classic_conditions
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params: [30]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
        noDataState: OK
        execErrState: Error
        for: 0s
        isPaused: false
        annotations:
          summary: La temperatura supera los 30 C
          description: La temperatura del invernadero esta por encima del rango optimo del tomate.
        labels:
          severity: critical
          magnitud: temperatura
          sentido: alta

      - uid: temperatura-baja
        title: Temperatura baja (menos de 15 C)
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: influxdb-iot
            model:
              refId: A
              datasource:
                type: influxdb
                uid: influxdb-iot
              rawQuery: true
              resultFormat: time_series
              query: |
                from(bucket: "iot")
                  |> range(start: -5m)
                  |> filter(fn: (r) => r._measurement == "clima" and r._field == "temperatura_c")
                  |> keep(columns: ["_time", "_value", "_field", "dispositivo"])
                  |> group(columns: ["_field", "dispositivo"])
                  |> sort(columns: ["_time"])
                  |> last()
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              datasource:
                type: __expr__
                uid: __expr__
              type: classic_conditions
              conditions:
                - type: query
                  evaluator:
                    type: lt
                    params: [15]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
        noDataState: OK
        execErrState: Error
        for: 0s
        isPaused: false
        annotations:
          summary: La temperatura esta por debajo de los 15 C
          description: La temperatura del invernadero esta por debajo del rango optimo del tomate.
        labels:
          severity: critical
          magnitud: temperatura
          sentido: baja

      - uid: humedad-alta
        title: Humedad alta (mas de 80 %)
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: influxdb-iot
            model:
              refId: A
              datasource:
                type: influxdb
                uid: influxdb-iot
              rawQuery: true
              resultFormat: time_series
              query: |
                from(bucket: "iot")
                  |> range(start: -5m)
                  |> filter(fn: (r) => r._measurement == "clima" and r._field == "humedad_pct")
                  |> keep(columns: ["_time", "_value", "_field", "dispositivo"])
                  |> group(columns: ["_field", "dispositivo"])
                  |> sort(columns: ["_time"])
                  |> last()
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              datasource:
                type: __expr__
                uid: __expr__
              type: classic_conditions
              conditions:
                - type: query
                  evaluator:
                    type: gt
                    params: [80]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
        noDataState: OK
        execErrState: Error
        for: 0s
        isPaused: false
        annotations:
          summary: La humedad supera el 80 %
          description: La humedad relativa del invernadero esta por encima del rango optimo del tomate.
        labels:
          severity: warning
          magnitud: humedad
          sentido: alta

      - uid: humedad-baja
        title: Humedad baja (menos de 60 %)
        condition: B
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: influxdb-iot
            model:
              refId: A
              datasource:
                type: influxdb
                uid: influxdb-iot
              rawQuery: true
              resultFormat: time_series
              query: |
                from(bucket: "iot")
                  |> range(start: -5m)
                  |> filter(fn: (r) => r._measurement == "clima" and r._field == "humedad_pct")
                  |> keep(columns: ["_time", "_value", "_field", "dispositivo"])
                  |> group(columns: ["_field", "dispositivo"])
                  |> sort(columns: ["_time"])
                  |> last()
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              datasource:
                type: __expr__
                uid: __expr__
              type: classic_conditions
              conditions:
                - type: query
                  evaluator:
                    type: lt
                    params: [60]
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    type: last
        noDataState: OK
        execErrState: Error
        for: 0s
        isPaused: false
        annotations:
          summary: La humedad esta por debajo del 60 %
          description: La humedad relativa del invernadero esta por debajo del rango optimo del tomate.
        labels:
          severity: warning
          magnitud: humedad
          sentido: baja
