                  |> keep(columns: ["_time", "_value", "_field", "dispositivo"])
                  |> group(columns: ["_field", "dispositivo"])
                  |> sort(columns: ["_time"])
                  |> last()
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              datasource:
                type: __expr__
                uid: __expr__
              type: classic_conditions
              conditions:
                - type: query
